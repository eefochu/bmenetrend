name: Android builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debug
            task: assembleDebug
          - variant: release
            task: assembleRelease

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace :app:${{ matrix.task }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: bmenetrend-${{ matrix.variant }}
          path: app/build/outputs/apk/${{ matrix.variant }}/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: bmenetrend-${{ matrix.variant }}-mapping
          path: app/build/outputs/mapping/${{ matrix.variant }}/mapping.txt
          if-no-files-found: error
          retention-days: 14
